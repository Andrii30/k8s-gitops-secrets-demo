apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-secure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: "10.4.1"
    helm:
      valuesObject:
        gitea:
          admin:
            existingSecret: gitea-admin-credentials
          config:
            database:
              DB_TYPE: sqlite3
        persistence:
          enabled: false
        postgresql:
          enabled: false
        postgresql-ha:
          enabled: false
        redis-cluster:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-secrets-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
