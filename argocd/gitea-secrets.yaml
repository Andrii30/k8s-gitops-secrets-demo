apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Andrii30/k8s-gitops-secrets-demo.git
    targetRevision: main
    path: secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-secrets-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
