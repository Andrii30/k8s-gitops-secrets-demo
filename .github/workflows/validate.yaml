name: validate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install yamllint
      - run: yamllint -c .yamllint.yaml .

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kc.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform
      - name: Validate manifests
        run: |
          files=$(find . -path ./.git -prune -o -type f \( -name '*.yaml' -o -name '*.yml' \) -print | grep -v '.github/' || true)
          [ -z "$files" ] && { echo "no manifests"; exit 0; }
          echo "$files" | xargs kubeconform -strict -ignore-missing-schemas -summary
