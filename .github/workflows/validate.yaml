name: validate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install yamllint
      - run: yamllint -c .yamllint.yaml .

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kc.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform
      - name: Validate manifests
        run: |
          dirs=""
          for d in argocd apps manifests secrets; do [ -d "$d" ] && dirs="$dirs $d"; done
          [ -z "$dirs" ] && { echo "no manifest dirs — nothing to validate"; exit 0; }
          find $dirs -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 \
            | xargs -0 kubeconform -strict -ignore-missing-schemas -summary
